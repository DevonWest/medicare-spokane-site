# Build and deploy the site container to Google Cloud Run.
#
# Triggers
#   - push to main              → deploys beta
#   - manual workflow_dispatch  → choose beta or production
#
# Required GitHub repository Variables:
#   GCP_PROJECT_ID
#   GCP_REGION
#   CLOUD_RUN_SERVICE
#   CLOUD_RUN_SERVICE_BETA
#   ARTIFACT_REGISTRY_REPO
#   FIREBASE_PROJECT_ID
#   RUNTIME_SERVICE_ACCOUNT
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#   GCP_DEPLOY_SERVICE_ACCOUNT
#   NEXT_PUBLIC_GTM_ID optional
#   NEXT_PUBLIC_FIREBASE_API_KEY required before enabling Knowledge CMS
#   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN required before enabling Knowledge CMS
#   KNOWLEDGE_CMS_ENABLED optional; defaults to false
#   KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED optional; defaults to false
#   KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED optional; defaults to false
#   KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED optional; defaults to false
#   KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_EXECUTION_ENABLED optional; defaults to false
#   KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED optional; defaults to false
#   KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_RECEIPT required only for cutover
#   KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE optional; static, private shadow, or guarded cutover
#   KNOWLEDGE_CMS_SEO_ENABLED optional; follows the private CMS gate when unset
#   KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED optional; defaults to false
#   KNOWLEDGE_CMS_AI_ENABLED optional; defaults to false
#   KNOWLEDGE_CMS_AI_MAX_OUTPUT_TOKENS optional; defaults to 16000
#   KNOWLEDGE_CMS_AI_DEEP_MAX_OUTPUT_TOKENS optional; defaults to 24000
#   KNOWLEDGE_CMS_AI_TIMEOUT_MS optional; defaults to 180000
#   KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED optional; defaults to false
#   OPENAI_API_KEY_SECRET required when the AI gate is true (Secret Manager name)
#   KNOWLEDGE_CMS_SEO_CRON_TOKEN_SECRET required when continuous SEO is true
#   recurring SEO also requires a current live activation check from the admin workspace
#
# Required Google Cloud setup:
#   - Artifact Registry repo exists
#   - Cloud Run beta/prod services exist
#   - Runtime service account has Firestore access
#   - Deployer service account can deploy Cloud Run and push images

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - production

concurrency:
  group: deploy-cloud-run-${{ github.ref }}-${{ github.event.inputs.target || 'beta' }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, build, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint
      - run: npm test

      - name: Build sanity check
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://beta.medicareinspokane.com
          NEXT_PUBLIC_SITE_ENV: staging
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}

  deploy:
    name: Build image and deploy to Cloud Run
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}
      RUNTIME_SA: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      KNOWLEDGE_CMS_ENABLED: ${{ vars.KNOWLEDGE_CMS_ENABLED || 'false' }}
      KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED: ${{ vars.KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED || 'false' }}
      KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED: ${{ vars.KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED || 'false' }}
      KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED: ${{ vars.KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED || 'false' }}
      KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_EXECUTION_ENABLED: ${{ vars.KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_EXECUTION_ENABLED || 'false' }}
      KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED: ${{ vars.KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED || 'false' }}
      KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_RECEIPT: ${{ vars.KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_RECEIPT || '' }}
      KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE: ${{ vars.KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE || 'static' }}
      KNOWLEDGE_CMS_SEO_ENABLED: ${{ vars.KNOWLEDGE_CMS_SEO_ENABLED || vars.KNOWLEDGE_CMS_ENABLED || 'false' }}
      KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED: ${{ vars.KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED || 'false' }}
      KNOWLEDGE_CMS_AI_ENABLED: ${{ vars.KNOWLEDGE_CMS_AI_ENABLED || 'false' }}
      KNOWLEDGE_CMS_AI_MAX_OUTPUT_TOKENS: ${{ vars.KNOWLEDGE_CMS_AI_MAX_OUTPUT_TOKENS || '16000' }}
      KNOWLEDGE_CMS_AI_DEEP_MAX_OUTPUT_TOKENS: ${{ vars.KNOWLEDGE_CMS_AI_DEEP_MAX_OUTPUT_TOKENS || '24000' }}
      KNOWLEDGE_CMS_AI_TIMEOUT_MS: ${{ vars.KNOWLEDGE_CMS_AI_TIMEOUT_MS || '180000' }}
      KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED: ${{ vars.KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED || 'false' }}
      SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL || 'sc-domain:medicareinspokane.com' }}
      KNOWLEDGE_CMS_AI_MODEL: ${{ vars.KNOWLEDGE_CMS_AI_MODEL || 'gpt-5.6-terra' }}
      KNOWLEDGE_CMS_AI_DEEP_MODEL: ${{ vars.KNOWLEDGE_CMS_AI_DEEP_MODEL || 'gpt-5.6-sol' }}
      TARGET: ${{ github.event.inputs.target || 'beta' }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve target config
        id: cfg
        run: |
          if [ "$TARGET" = "production" ]; then
            echo "service=${{ vars.CLOUD_RUN_SERVICE }}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://www.medicareinspokane.com" >> "$GITHUB_OUTPUT"
            echo "site_env=production" >> "$GITHUB_OUTPUT"
          else
            echo "service=${{ vars.CLOUD_RUN_SERVICE_BETA }}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://beta.medicareinspokane.com" >> "$GITHUB_OUTPUT"
            echo "site_env=staging" >> "$GITHUB_OUTPUT"
          fi

          if [ "$KNOWLEDGE_CMS_AI_ENABLED" = "true" ]; then
            echo "openai_secret=OPENAI_API_KEY=${{ vars.OPENAI_API_KEY_SECRET }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "openai_secret=" >> "$GITHUB_OUTPUT"
          fi
          if [ "$KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED" = "true" ]; then
            echo "seo_cron_secret=KNOWLEDGE_CMS_SEO_CRON_TOKEN=${{ vars.KNOWLEDGE_CMS_SEO_CRON_TOKEN_SECRET }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "seo_cron_secret=" >> "$GITHUB_OUTPUT"
          fi

          echo "image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/site-${TARGET}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Validate required variables
        run: |
          test -n "${{ env.PROJECT_ID }}" || (echo "::error::GCP_PROJECT_ID is missing" && exit 1)
          test -n "${{ env.REGION }}" || (echo "::error::GCP_REGION is missing" && exit 1)
          test -n "${{ env.AR_REPO }}" || (echo "::error::ARTIFACT_REGISTRY_REPO is missing" && exit 1)
          test -n "${{ env.RUNTIME_SA }}" || (echo "::error::RUNTIME_SERVICE_ACCOUNT is missing" && exit 1)
          test -n "${{ env.FIREBASE_PROJECT_ID }}" || (echo "::error::FIREBASE_PROJECT_ID is missing" && exit 1)
          test -n "${{ steps.cfg.outputs.service }}" || (echo "::error::Cloud Run service variable is missing" && exit 1)
          test -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" || (echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER is missing" && exit 1)
          test -n "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}" || (echo "::error::GCP_DEPLOY_SERVICE_ACCOUNT is missing" && exit 1)
          case "$KNOWLEDGE_CMS_ENABLED" in
            false)
              ;;
            true)
              test -n "$NEXT_PUBLIC_FIREBASE_API_KEY" || (echo "::error::NEXT_PUBLIC_FIREBASE_API_KEY is required when Knowledge CMS is enabled" && exit 1)
              test -n "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" || (echo "::error::NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN is required when Knowledge CMS is enabled" && exit 1)
              ;;
            *)
              echo "::error::KNOWLEDGE_CMS_ENABLED must be exactly true or false"
              exit 1
              ;;
          esac
          for feature_flag in KNOWLEDGE_CMS_SEO_ENABLED KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED KNOWLEDGE_CMS_AI_ENABLED KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED; do
            feature_value="${!feature_flag}"
            case "$feature_value" in
              true|false) ;;
              *) echo "::error::$feature_flag must be exactly true or false"; exit 1 ;;
            esac
          done
          if [ "$KNOWLEDGE_CMS_SEO_ENABLED" = "true" ]; then
            test "$KNOWLEDGE_CMS_ENABLED" = "true" || (echo "::error::KNOWLEDGE_CMS_SEO_ENABLED requires KNOWLEDGE_CMS_ENABLED=true" && exit 1)
          fi
          if [ "$KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED" = "true" ]; then
            test "$KNOWLEDGE_CMS_SEO_ENABLED" = "true" || (echo "::error::KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED requires KNOWLEDGE_CMS_SEO_ENABLED=true" && exit 1)
            test -n "$SEARCH_CONSOLE_SITE_URL" || (echo "::error::SEARCH_CONSOLE_SITE_URL is required" && exit 1)
          fi
          if [ "$KNOWLEDGE_CMS_AI_ENABLED" = "true" ]; then
            test "$KNOWLEDGE_CMS_SEO_ENABLED" = "true" || (echo "::error::KNOWLEDGE_CMS_AI_ENABLED requires KNOWLEDGE_CMS_SEO_ENABLED=true" && exit 1)
            case "${{ vars.OPENAI_API_KEY_SECRET }}" in
              ''|*[!A-Za-z0-9_-]*) echo "::error::OPENAI_API_KEY_SECRET must name a Secret Manager secret"; exit 1 ;;
            esac
          fi
          for token_limit in KNOWLEDGE_CMS_AI_MAX_OUTPUT_TOKENS KNOWLEDGE_CMS_AI_DEEP_MAX_OUTPUT_TOKENS; do
            token_value="${!token_limit}"
            case "$token_value" in
              ''|*[!0-9]*) echo "::error::$token_limit must be an integer"; exit 1 ;;
            esac
            test "$token_value" -ge 4000 -a "$token_value" -le 40000 || (echo "::error::$token_limit must be between 4000 and 40000" && exit 1)
          done
          case "$KNOWLEDGE_CMS_AI_TIMEOUT_MS" in
            ''|*[!0-9]*) echo "::error::KNOWLEDGE_CMS_AI_TIMEOUT_MS must be an integer"; exit 1 ;;
          esac
          test "$KNOWLEDGE_CMS_AI_TIMEOUT_MS" -ge 30000 -a "$KNOWLEDGE_CMS_AI_TIMEOUT_MS" -le 240000 || (echo "::error::KNOWLEDGE_CMS_AI_TIMEOUT_MS must be between 30000 and 240000" && exit 1)
          if [ "$KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED" = "true" ]; then
            test "$KNOWLEDGE_CMS_SEO_ENABLED" = "true" || (echo "::error::KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED requires KNOWLEDGE_CMS_SEO_ENABLED=true" && exit 1)
            test "$KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED" = "true" || (echo "::error::KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED requires KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED=true" && exit 1)
            case "${{ vars.KNOWLEDGE_CMS_SEO_CRON_TOKEN_SECRET }}" in
              ''|*[!A-Za-z0-9_-]*) echo "::error::KNOWLEDGE_CMS_SEO_CRON_TOKEN_SECRET must name a Secret Manager secret"; exit 1 ;;
            esac
          fi
          case "$KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE" in
            static|shadow|cutover)
              ;;
            *)
              echo "::error::KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE must be exactly static, shadow, or cutover"
              exit 1
              ;;
          esac
          case "$KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED" in
            false)
              ;;
            true)
              test "$KNOWLEDGE_CMS_ENABLED" = "true" || (echo "::error::KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED requires KNOWLEDGE_CMS_ENABLED=true" && exit 1)
              ;;
            *)
              echo "::error::KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED must be exactly true or false"
              exit 1
              ;;
          esac
          case "$KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED" in
            false)
              ;;
            true)
              test "$KNOWLEDGE_CMS_ENABLED" = "true" || (echo "::error::KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED requires KNOWLEDGE_CMS_ENABLED=true" && exit 1)
              ;;
            *)
              echo "::error::KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED must be exactly true or false"
              exit 1
              ;;
          esac
          case "$KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED" in
            false)
              ;;
            true)
              test "$KNOWLEDGE_CMS_ENABLED" = "true" || (echo "::error::KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED requires KNOWLEDGE_CMS_ENABLED=true" && exit 1)
              test "$KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE" = "shadow" || (echo "::error::KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED requires KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE=shadow" && exit 1)
              ;;
            *)
              echo "::error::KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED must be exactly true or false"
              exit 1
              ;;
          esac
          case "$KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_EXECUTION_ENABLED" in
            false)
              ;;
            true)
              test "$TARGET" = "beta" || (echo "::error::Public cutover approval may be created only on beta" && exit 1)
              test "$KNOWLEDGE_CMS_ENABLED" = "true" || (echo "::error::Public cutover approval requires KNOWLEDGE_CMS_ENABLED=true" && exit 1)
              test "$KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE" = "shadow" || (echo "::error::Public cutover approval requires exact shadow mode" && exit 1)
              test "$KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED" = "false" || (echo "::error::Public cutover approval requires the cutover gate false" && exit 1)
              test "$KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED" = "false" || (echo "::error::Public cutover approval requires article execution false" && exit 1)
              test "$KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED" = "false" || (echo "::error::Public cutover approval requires supporting execution false" && exit 1)
              test "$KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED" = "false" || (echo "::error::Public cutover approval requires rendering execution false" && exit 1)
              ;;
            *)
              echo "::error::KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_EXECUTION_ENABLED must be exactly true or false"
              exit 1
              ;;
          esac
          case "$KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED" in
            false)
              test "$KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE" != "cutover" || (echo "::error::Renderer cutover requires KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED=true" && exit 1)
              ;;
            true)
              test "$KNOWLEDGE_CMS_ENABLED" = "true" || (echo "::error::Public cutover requires KNOWLEDGE_CMS_ENABLED=true" && exit 1)
              test "$KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE" = "cutover" || (echo "::error::Public cutover requires KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE=cutover" && exit 1)
              test "$KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_EXECUTION_ENABLED" = "false" || (echo "::error::Public cutover requires approval execution false" && exit 1)
              test "$KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED" = "false" || (echo "::error::Public cutover requires article execution false" && exit 1)
              test "$KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED" = "false" || (echo "::error::Public cutover requires supporting execution false" && exit 1)
              test "$KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED" = "false" || (echo "::error::Public cutover requires rendering execution false" && exit 1)
              test "${#KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_RECEIPT}" -eq 64 || (echo "::error::Public cutover approval receipt must be exactly 64 lowercase hex characters" && exit 1)
              case "$KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_RECEIPT" in
                *[!0-9a-f]*) echo "::error::Public cutover approval receipt must be lowercase hexadecimal"; exit 1 ;;
              esac
              ;;
            *)
              echo "::error::KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED must be exactly true or false"
              exit 1
              ;;
          esac

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        id: setup_gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 573.0.0"

      - name: Verify Cloud SDK readiness-probe support
        run: |
          echo "Cloud SDK version: ${{ steps.setup_gcloud.outputs.version }}"
          if ! gcloud run deploy --help 2>&1 | grep -Fq -- "--readiness-probe"; then
            echo "::error::Cloud SDK must support gcloud run deploy --readiness-probe"
            exit 1
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build container image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL='${{ steps.cfg.outputs.site_url }}' \
            --build-arg NEXT_PUBLIC_SITE_ENV='${{ steps.cfg.outputs.site_env }}' \
            --build-arg NEXT_PUBLIC_GTM_ID='${{ vars.NEXT_PUBLIC_GTM_ID }}' \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_FIREBASE_API_KEY" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            -t "${{ steps.cfg.outputs.image }}" \
            .

      - name: Push container image
        run: docker push "${{ steps.cfg.outputs.image }}"

      - name: Deploy standard or beta-canary revision
        id: deploy_standard
        if: ${{ env.KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED != 'true' || env.TARGET != 'production' }}
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ steps.cfg.outputs.service }}
          region: ${{ env.REGION }}
          image: ${{ steps.cfg.outputs.image }}
          flags: >-
            --service-account=${{ env.RUNTIME_SA }}
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=10
            --startup-probe=httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=0,failureThreshold=30,timeoutSeconds=2,periodSeconds=2
            --readiness-probe=httpGet.path=/healthz,httpGet.port=8080,successThreshold=1,failureThreshold=3,timeoutSeconds=2,periodSeconds=10
          env_vars: |
            NEXT_PUBLIC_SITE_URL=${{ steps.cfg.outputs.site_url }}
            NEXT_PUBLIC_SITE_ENV=${{ steps.cfg.outputs.site_env }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }}
            KNOWLEDGE_CMS_ENABLED=${{ env.KNOWLEDGE_CMS_ENABLED }}
            KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED=${{ env.KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED }}
            KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED=${{ env.KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED }}
            KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED=${{ env.KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED }}
            KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_EXECUTION_ENABLED=${{ env.KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_EXECUTION_ENABLED }}
            KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED=${{ env.KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED }}
            KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_RECEIPT=${{ env.KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_RECEIPT }}
            KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE=${{ env.KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE }}
            KNOWLEDGE_CMS_SEO_ENABLED=${{ env.KNOWLEDGE_CMS_SEO_ENABLED }}
            KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED=${{ env.KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED }}
            KNOWLEDGE_CMS_AI_ENABLED=${{ env.KNOWLEDGE_CMS_AI_ENABLED }}
            KNOWLEDGE_CMS_AI_MAX_OUTPUT_TOKENS=${{ env.KNOWLEDGE_CMS_AI_MAX_OUTPUT_TOKENS }}
            KNOWLEDGE_CMS_AI_DEEP_MAX_OUTPUT_TOKENS=${{ env.KNOWLEDGE_CMS_AI_DEEP_MAX_OUTPUT_TOKENS }}
            KNOWLEDGE_CMS_AI_TIMEOUT_MS=${{ env.KNOWLEDGE_CMS_AI_TIMEOUT_MS }}
            KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED=${{ env.KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED }}
            SEARCH_CONSOLE_SITE_URL=${{ env.SEARCH_CONSOLE_SITE_URL }}
            KNOWLEDGE_CMS_AI_MODEL=${{ env.KNOWLEDGE_CMS_AI_MODEL }}
            KNOWLEDGE_CMS_AI_DEEP_MODEL=${{ env.KNOWLEDGE_CMS_AI_DEEP_MODEL }}
            APP_COMMIT_SHA=${{ github.sha }}
            NODE_ENV=production
          secrets: |
            ${{ steps.cfg.outputs.openai_secret }}
            ${{ steps.cfg.outputs.seo_cron_secret }}

      - name: Deploy production cutover candidate with no traffic
        id: deploy_cutover_candidate
        if: ${{ env.KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED == 'true' && env.TARGET == 'production' }}
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ steps.cfg.outputs.service }}
          region: ${{ env.REGION }}
          image: ${{ steps.cfg.outputs.image }}
          flags: >-
            --service-account=${{ env.RUNTIME_SA }}
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=10
            --no-traffic
            --tag=cms-cutover-candidate
            --startup-probe=httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=0,failureThreshold=30,timeoutSeconds=2,periodSeconds=2
            --readiness-probe=httpGet.path=/healthz,httpGet.port=8080,successThreshold=1,failureThreshold=3,timeoutSeconds=2,periodSeconds=10
          env_vars: |
            NEXT_PUBLIC_SITE_URL=${{ steps.cfg.outputs.site_url }}
            NEXT_PUBLIC_SITE_ENV=${{ steps.cfg.outputs.site_env }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }}
            KNOWLEDGE_CMS_ENABLED=${{ env.KNOWLEDGE_CMS_ENABLED }}
            KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED=${{ env.KNOWLEDGE_CMS_ARTICLE_MIGRATION_EXECUTION_ENABLED }}
            KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED=${{ env.KNOWLEDGE_CMS_SUPPORTING_MIGRATION_EXECUTION_ENABLED }}
            KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED=${{ env.KNOWLEDGE_CMS_NATIVE_REPRESENTATION_EXECUTION_ENABLED }}
            KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_EXECUTION_ENABLED=${{ env.KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_EXECUTION_ENABLED }}
            KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED=${{ env.KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED }}
            KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_RECEIPT=${{ env.KNOWLEDGE_CMS_PUBLIC_CUTOVER_APPROVAL_RECEIPT }}
            KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE=${{ env.KNOWLEDGE_CMS_PUBLIC_RENDERER_MODE }}
            KNOWLEDGE_CMS_SEO_ENABLED=${{ env.KNOWLEDGE_CMS_SEO_ENABLED }}
            KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED=${{ env.KNOWLEDGE_CMS_SEARCH_CONSOLE_ENABLED }}
            KNOWLEDGE_CMS_AI_ENABLED=${{ env.KNOWLEDGE_CMS_AI_ENABLED }}
            KNOWLEDGE_CMS_AI_MAX_OUTPUT_TOKENS=${{ env.KNOWLEDGE_CMS_AI_MAX_OUTPUT_TOKENS }}
            KNOWLEDGE_CMS_AI_DEEP_MAX_OUTPUT_TOKENS=${{ env.KNOWLEDGE_CMS_AI_DEEP_MAX_OUTPUT_TOKENS }}
            KNOWLEDGE_CMS_AI_TIMEOUT_MS=${{ env.KNOWLEDGE_CMS_AI_TIMEOUT_MS }}
            KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED=${{ env.KNOWLEDGE_CMS_CONTINUOUS_SEO_ENABLED }}
            SEARCH_CONSOLE_SITE_URL=${{ env.SEARCH_CONSOLE_SITE_URL }}
            KNOWLEDGE_CMS_AI_MODEL=${{ env.KNOWLEDGE_CMS_AI_MODEL }}
            KNOWLEDGE_CMS_AI_DEEP_MODEL=${{ env.KNOWLEDGE_CMS_AI_DEEP_MODEL }}
            APP_COMMIT_SHA=${{ github.sha }}
            NODE_ENV=production
          secrets: |
            ${{ steps.cfg.outputs.openai_secret }}
            ${{ steps.cfg.outputs.seo_cron_secret }}

      - name: Verify deployed public health
        if: ${{ env.KNOWLEDGE_CMS_PUBLIC_CUTOVER_ENABLED != 'true' || env.TARGET != 'production' }}
        run: >-
          node scripts/verify-cloud-run-health.mjs
          --url "${{ steps.cfg.outputs.site_url }}/healthz"
          --commit "${{ github.sha }}"
          --target "$TARGET"
          --attempts 36
          --delay-ms 5000
          --timeout-ms 10000

      - name: Show service URL
        run: |
          echo "Deployed target: $TARGET"
          gcloud run services describe "${{ steps.cfg.outputs.service }}" \
            --region "$REGION" \
            --format='value(status.url)'
