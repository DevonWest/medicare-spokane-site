name: Weekly SEO evidence scan

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy to Cloud Run
    types:
      - completed

concurrency:
  group: weekly-seo-evidence-production
  cancel-in-progress: false

jobs:
  scan:
    if: >-
      ${{
        vars.KNOWLEDGE_CMS_CONTINUOUS_SEO_KILL_SWITCH != 'true' &&
        (
          github.event_name != 'workflow_run' ||
          (
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            (
              github.event.workflow_run.event == 'push' ||
              github.event.workflow_run.event == 'workflow_dispatch'
            )
          )
        )
      }}
    name: Run protected production scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      id-token: write

    env:
      SEO_SCAN_URL: https://www.medicareinspokane.com/api/knowledge-cms/seo-scan

    steps:
      - name: Validate configuration
        run: |
          test "$GITHUB_REPOSITORY" = "DevonWest/medicare-spokane-site" || (echo "::error::Weekly scan must run from the production repository" && exit 1)
          test "$GITHUB_REF" = "refs/heads/main" || (echo "::error::Weekly scan must run from main" && exit 1)

      - name: Request GitHub scheduler identity
        id: scheduler_auth
        uses: actions/github-script@v8
        with:
          script: |
            const idToken = await core.getIDToken(process.env.SEO_SCAN_URL);
            core.setSecret(idToken);
            core.setOutput("id_token", idToken);

      - name: Run weekly evidence scan
        env:
          SCHEDULER_ID_TOKEN: ${{ steps.scheduler_auth.outputs.id_token }}
        run: |
          test -n "$SCHEDULER_ID_TOKEN" || (echo "::error::GitHub OIDC did not issue a scheduler ID token" && exit 1)
          echo "::add-mask::$SCHEDULER_ID_TOKEN"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status_code="$(curl \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 900 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $SCHEDULER_ID_TOKEN" \
            --data '{}' \
            "$SEO_SCAN_URL")"
          unset SCHEDULER_ID_TOKEN

          if [ "$status_code" != "200" ]; then
            echo "::error::Weekly SEO scan failed with HTTP $status_code"
            sed -n '1,20p' "$response_file"
            exit 1
          fi

          node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload.status !== "ok" || typeof payload.scanId !== "string") {
            throw new Error("Weekly SEO scan returned an invalid success response.");
          }
          console.log(
            `Weekly SEO evidence saved: ${payload.scanId} (${payload.opportunities} prioritized opportunities).`,
          );
          NODE
